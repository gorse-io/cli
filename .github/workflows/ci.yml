name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o gorse-cli .
      - run: sh -n install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test npm/test/*.test.js
        env:
          GORSE_CLI_TEST_BINARY: ${{ github.workspace }}/gorse-cli

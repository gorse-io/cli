name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Test shell installer
        if: runner.os != 'Windows'
        env:
          INSTALL_DIR: ${{ runner.temp }}/gorse-cli-install
        run: |
          sh install.sh
          "$INSTALL_DIR/gorse-cli" --version
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        env:
          INSTALL_DIR: ${{ runner.temp }}/gorse-cli-install
        run: |
          . ./install.ps1
          gorse-cli --version

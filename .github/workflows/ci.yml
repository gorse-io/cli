name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Test Homebrew formula updater
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Test shell installer
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          gorse-cli --version
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          . ./install.ps1
          gorse-cli --version

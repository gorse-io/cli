name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  homebrew:
    needs: binaries
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: homebrew
      cancel-in-progress: false
    steps:
      - name: Bump macOS Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: gorse-cli
          tag-name: ${{ github.event.release.tag_name }}
          download-url: https://github.com/gorse-io/cli/releases/download/${{ github.event.release.tag_name }}/gorse-cli_darwin_arm64
          homebrew-tap: gorse-io/homebrew-tap
          push-to: gorse-io/homebrew-tap
          create-branch: true
          create-pullrequest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Token with Contents and Pull requests write access to gorse-io/homebrew-tap.
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  scoop:
    needs: binaries
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          gh api --method POST repos/gorse-io/scoop-bucket/dispatches \
            -f event_type=release
  npm:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download release binaries
        run: gh release download "$RELEASE_TAG" --pattern 'gorse-cli_*' --dir dist/npm-binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage npm packages
        run: node npm/scripts/build-packages.js "$RELEASE_TAG" dist/npm-binaries dist/npm
      - name: Publish platform packages before the launcher
        run: |
          set -e
          tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then tag=next; fi
          for package in dist/npm/cli-*; do
            npm publish "./$package" --access public --tag "$tag"
          done
          npm publish ./dist/npm/cli --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

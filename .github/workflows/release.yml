name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  homebrew:
    needs: binaries
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: homebrew
      cancel-in-progress: false
    steps:
      - name: Bump macOS Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: gorse-cli
          tag-name: ${{ github.event.release.tag_name }}
          download-url: https://github.com/gorse-io/cli/releases/download/${{ github.event.release.tag_name }}/gorse-cli_darwin_arm64
          homebrew-tap: gorse-io/homebrew-tap
          push-to: gorse-io/homebrew-tap
          create-branch: true
          create-pullrequest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Token with Contents and Pull requests write access to gorse-io/homebrew-tap.
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  scoop:
    needs: binaries
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          gh api --method POST repos/gorse-io/scoop-bucket/dispatches \
            -f event_type=release
  npm:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download release binaries and prepare npm packages
        run: |
          set -e
          gh release download "$RELEASE_TAG" --pattern 'gorse-cli_*' --dir dist/npm-binaries
          version="${RELEASE_TAG#v}"
          mkdir -p dist/npm/cli/bin
          cp npm/package.json README.md LICENSE dist/npm/cli/
          cp npm/bin/gorse-cli.js dist/npm/cli/bin/
          for package in npm/packages/*; do
            target="$(basename "$package")"
            directory="dist/npm/cli-$target"
            mkdir -p "$directory/bin"
            cp "$package/package.json" README.md LICENSE "$directory/"
            (cd "$directory" && npm version "$version" --no-git-tag-version)
            npm --prefix dist/npm/cli pkg set "optionalDependencies.@gorse/cli-$target=$version"
          done
          cp dist/npm-binaries/gorse-cli_linux_amd64 dist/npm/cli-linux-x64/bin/gorse-cli
          cp dist/npm-binaries/gorse-cli_linux_arm64 dist/npm/cli-linux-arm64/bin/gorse-cli
          cp dist/npm-binaries/gorse-cli_linux_loong64 dist/npm/cli-linux-loong64/bin/gorse-cli
          cp dist/npm-binaries/gorse-cli_linux_riscv64 dist/npm/cli-linux-riscv64/bin/gorse-cli
          cp dist/npm-binaries/gorse-cli_windows_amd64.exe dist/npm/cli-win32-x64/bin/gorse-cli.exe
          cp dist/npm-binaries/gorse-cli_windows_arm64.exe dist/npm/cli-win32-arm64/bin/gorse-cli.exe
          cp dist/npm-binaries/gorse-cli_darwin_arm64 dist/npm/cli-darwin-arm64/bin/gorse-cli
          chmod +x dist/npm/*/bin/*
          (cd dist/npm/cli && npm version "$version" --no-git-tag-version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish platform packages before the launcher
        run: |
          set -e
          tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then tag=next; fi
          for package in dist/npm/cli-*; do
            npm publish "./$package" --access public --tag "$tag"
          done
          npm publish ./dist/npm/cli --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

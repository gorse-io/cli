name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  homebrew:
    needs: binaries
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: homebrew
      cancel-in-progress: false
    steps:
      - name: Bump macOS Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: gorse-cli
          tag-name: ${{ github.event.release.tag_name }}
          download-url: https://github.com/gorse-io/cli/releases/download/${{ github.event.release.tag_name }}/gorse-cli_darwin_arm64
          homebrew-tap: gorse-io/homebrew-tap
          push-to: gorse-io/homebrew-tap
          create-branch: true
          create-pullrequest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Token with Contents and Pull requests write access to gorse-io/homebrew-tap.
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  scoop:
    needs: binaries
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          gh api --method POST repos/gorse-io/scoop-bucket/dispatches \
            -f event_type=release
  npm:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download release binaries
        run: gh release download "$RELEASE_TAG" --pattern 'gorse-cli_*' --dir dist/npm-binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy release binaries into platform packages
        run: |
          set -e
          for package in npm/packages/*; do
            mkdir -p "$package/bin"
            cp README.md LICENSE "$package/"
          done
          cp dist/npm-binaries/gorse-cli_linux_amd64 npm/packages/linux-x64/bin/gorse-cli
          cp dist/npm-binaries/gorse-cli_linux_arm64 npm/packages/linux-arm64/bin/gorse-cli
          cp dist/npm-binaries/gorse-cli_linux_loong64 npm/packages/linux-loong64/bin/gorse-cli
          cp dist/npm-binaries/gorse-cli_linux_riscv64 npm/packages/linux-riscv64/bin/gorse-cli
          cp dist/npm-binaries/gorse-cli_windows_amd64.exe npm/packages/win32-x64/bin/gorse-cli.exe
          cp dist/npm-binaries/gorse-cli_windows_arm64.exe npm/packages/win32-arm64/bin/gorse-cli.exe
          cp dist/npm-binaries/gorse-cli_darwin_arm64 npm/packages/darwin-arm64/bin/gorse-cli
          chmod +x npm/packages/*/bin/*
          cp README.md LICENSE npm/
      - name: Publish platform packages before the launcher
        run: |
          set -e
          version="${RELEASE_TAG#v}"
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          for package in npm/packages/*; do
            (cd "$package" && npm version "$version" --no-git-tag-version)
            npm --prefix npm pkg set "optionalDependencies.@gorse/cli-$(basename "$package")=$version"
            npm publish "./$package" --access public --tag "$tag"
          done
          cd npm
          npm version "$version" --no-git-tag-version
          npm publish . --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
